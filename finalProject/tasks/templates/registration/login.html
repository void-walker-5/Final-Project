{% extends "base_menu.html" %}

{% block title %}Login - Task Manager{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">

<div class="col-md-5 col-lg-4">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h1 class="text-center mb-4">
                Task Manager
            </h1>

            <h4 class="text-center mb-4">
                Login
            </h4>

            {% if form.errors %}
                <div class="alert alert-danger">
                    Your username and password did not match.
                    Please try again.
                </div>
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label
                        for="{{ form.username.id_for_label }}"
                        class="form-label"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        id="{{ form.username.id_for_label }}"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-3">
                    <label
                        for="{{ form.password.id_for_label }}"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        id="{{ form.password.id_for_label }}"
                        required
                    >
                </div>

                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

</div>

</div>

{% endblock %}
